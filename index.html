<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kevin Ying - Portfolio</title>
    <style>
        /* --- CSS Variables --- */
        :root {
            --bg-color: #F8F8F8;
            --text-color: #333333;
            --card-color: #FFFFFF;
            --border-color: #E0E0E0;
            --accent-color: #000000;
            --grid-max-width: 1200px;
            --nav-height: 60px;
            --gap-size: 1.5rem;
            --text-max-width: 65ch;
        }

        /* --- Reset & Base --- */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        
        body {
            font-family: 'Courier New', Courier, monospace;
            color: var(--text-color);
            background-color: var(--bg-color);
            padding-top: var(--nav-height);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            padding-bottom: 2rem;
            font-size: 0.95rem; 
        }

        a { text-decoration: none; color: inherit; }
        h1 { margin-bottom: 1rem; font-size: 2rem;}
        h2 { margin-bottom: 1rem; font-size: 1.2rem;}
        h3 { margin-bottom: 1rem; font-weight: bold;}
        p { margin-bottom: 0.8rem; font-size: 0.95rem; }

        /* --- The Modular Grid System --- */
        .grid-container {
            width: 100%;
            max-width: var(--grid-max-width);
            margin: 0 auto;
            padding: 0 1.5rem;
            display: grid;
            grid-template-columns: repeat(12, 1fr);
            gap: var(--gap-size);
        }

        /* --- Navbar --- */
        .navbar-wrapper {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: var(--nav-height);
            background-color: var(--bg-color);
            border-bottom: 1px solid var(--accent-color);
            z-index: 100;
            display: block;
        }

        .navbar-inner {
            width: 100%;
            max-width: none;
            padding: 0;
            height: 100%;
        }

        .nav-links {
            display: grid;
            grid-template-columns: 1fr 1fr;
            height: 100%;
            width: 100%;
        }

        .nav-link {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100%;
            width: 100%;
            transition: background-color 0.2s ease;
        }
        
        .nav-link:first-child { 
            border-right: 1px solid var(--accent-color); 
        }

        .nav-link:hover { background-color: #e0e0e0; }

        .nav-link h2 {
            margin: 0;
            font-weight: inherit;
        }

        /* --- Main Content Layout --- */
        main {
            padding-top: 2rem;
            flex: 1;
        }

        /* --- Intro Section --- */
        .intro-section {
            grid-column: 1 / -1;
            display: grid;
            grid-template-columns: repeat(12, 1fr);
            gap: 1rem;
            margin-bottom: 1rem;
            margin-top: 2rem;
        }

        .intro-text {
            grid-column: 1 / 7;
            padding-right: 2rem;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .intro-text h1,
        .intro-text p {
            max-width: var(--text-max-width);
        }

        /* --- Journal Entries / Project Cards --- */
        .journal-row {
            grid-column: 1 / -1; 
            border: 1px solid var(--accent-color);
            display: grid;
            grid-template-columns: repeat(12, 1fr);
            margin-bottom: 1rem; 
            overflow: hidden; 
            background: var(--card-color);
        }

        /* Interactive Project Entry */
        .entry-half {
            grid-column: span 6;
            position: relative;
            padding: 3rem;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 400px;
            transition: background-color 0.2s;
        }

        .entry-half:hover {
            background-color: #f0f0f0;
        }

        .entry-half.with-border-right {
            border-right: 1px solid var(--accent-color);
        }

        .entry-full {
            grid-column: 1 / -1;
            position: relative;
            padding: 3rem;
            display: flex;
            flex-direction: column;
            justify-content: center;
            min-height: 400px;
        }

        /* Metadata */
        .meta-title {
            position: absolute;
            top: 1rem;
            left: 1rem;
            font-weight: bold;
            padding: 0; /* Removed padding */
            background: transparent; /* Removed black background */
            color: var(--text-color); /* Changed from white to text color */
        }

        .meta-date {
            position: absolute;
            bottom: 1rem;
            left: 1rem;
            color: #666;
            font-style: italic;
        }

        /* Images */
        .entry-img-contain {
            max-width: 100%;
            max-height: 250px;
            width: auto;
            height: auto;
            object-fit: contain;
            display: block;
            margin: 0 auto 1rem auto;
        }

        .text-content {
            text-align: left; /* Changed from center to left */
            max-width: 100%;
        }

        /* Footer */
        footer {
            margin-top: 4rem;
            padding: 2rem 0;
        }
        .footer-content { 
            grid-column: 1 / -1; 
            color: #666; 
            font-size: 0.9rem; 
            text-align: center; /* Changed from center to left */
            margin: 0;
        }

        /* Responsiveness */
        @media (max-width: 768px) {
            .intro-text { 
                grid-column: 1 / -1; 
                margin-bottom: 1rem; 
                padding-right: 0;
            }
            
            .entry-half {
                grid-column: 1 / -1;
                border-right: none;
                border-bottom: 1px solid var(--accent-color);
                min-height: auto;
                padding: 4rem 1.5rem 2rem 1.5rem;
            }
            
            .entry-half:last-child { 
                border-bottom: none; 
            }
        }
    </style>
</head>
<body>

    <nav class="navbar-wrapper">
        <div class="navbar-inner">
            <div class="nav-links">
                <a href="./index.html" class="nav-link"><h2>Work</h2></a>
                <a href="./about.html" class="nav-link"><h2>Contact</h2></a>
            </div>
        </div>
    </nav>

    <main class="grid-container">

        <section class="intro-section">
            <div class="intro-text">
                <h1>Kevin Ying</h1>
                <p>Engineering Portfolio</p>
                <p>A collection of technical projects, robotics systems, and design studies.</p>
            </div>
        </section>

        <!-- Project Row 1 -->
        <article class="journal-row">
            
            <!-- Project 1: CAN Testbench -->
            <a href="./CANTB.html" class="entry-half with-border-right">
                <div class="meta-title">01</div>
                <div class="entry-content">
                    <img src="./Photos/CANTB/bench.png" alt="CAN Testbench" class="entry-img-contain">
                    <div class="text-content">
                        <h2>CAN Testbench</h2>
                        <p>Vehicle Communication Systems</p>
                    </div>
                </div>
            </a>

            <!-- Placeholder for Project 2 -->
            <a href="#" class="entry-half">
                <div class="meta-title">02</div>
                <div class="entry-content">
                    <!-- Placeholder Image Block -->
                    <div style="width: 200px; height: 150px; background: #eee; margin: 0 0 1rem 0; display: flex; align-items: center; justify-content: center;">
                        <span style="color: #999;">Image</span>
                    </div>
                    <div class="text-content">
                        <h2>Urban Life</h2>
                        <p>Design Study</p>
                    </div>
                </div>
            </a>

        </article>

    </main>

    <footer>
        <div class="grid-container">
            <div class="footer-content">
                &copy; 2025 Kevin Ying. All Rights Reserved.
            </div>
        </div>
    </footer>

</body>
</html>
